<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone Project
    </title>
    <link rel="stylesheet" href="DOM/Capstone_project.css">
</head>
<body>
    
<div id="app">
    <h2>Task Manager</h2>
    <div>
        <input type="text" id="taskInput" placeholder="New task...">
        <button id="addBtn">Add</button>
    </div>
    <div>
    <ul id="taskList"></ul>
    </div>

    <div>
        <button id="showAllBtn">All</button>
        <button id="showActiveBtn">Active</button>
        <button id="showDoneBtn">Done</button>
    
        <span id="counter"></span>
        <button id="clearDoneBtn">Clear Done</button>
    </div>
</div>
<script src="DOM/Capstone_project.js"></script>
</body>
</html>
